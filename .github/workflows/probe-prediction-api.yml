name: Check All-Race Forecast API
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-prediction-api.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate license, CORS, schema and coverage
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json
          for office,required in [('senate',35),('house',435),('governors',36)]:
            url='https://www.pollingforecast.com/api/us/'+office
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ElectionDashboard/1.0','Origin':'https://saiakhilvankamamidi23-jpg.github.io'}),timeout=30) as res:
              d=json.load(res)
              rows=d.get('rows',[])
              print('OFFICE',office,'HTTP',res.status,'CORS',res.headers.get('Access-Control-Allow-Origin'),'license',d.get('licence'),'asOf',d.get('asOf'),'count',len(rows),'keys',list(rows[0]) if rows else None)
              for row in rows[:3]:print('EXAMPLE',json.dumps({k:row.get(k) for k in ['key','kind','state','name','left_party','left_candidate','rep_candidate','winner','chance_left','rating','page','as_of']}))
              assert len(rows)==required, (office,len(rows))
              assert d['licence']=='CC BY 4.0'
              assert res.headers.get('Access-Control-Allow-Origin') in ['*','https://saiakhilvankamamidi23-jpg.github.io']
              assert all('key' in row and 'winner' in row for row in rows)
          PY