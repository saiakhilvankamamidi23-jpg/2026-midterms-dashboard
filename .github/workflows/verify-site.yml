name: Verify Public Election Dashboard
on:
  push:
    paths: [.github/workflows/verify-site.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live HTTPS site and HTML
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error
          url = "https://saiakhilvankamamidi23-jpg.github.io/2026-midterms-dashboard/"
          for attempt in range(1, 10):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ElectionDashboardSmokeTest/1.0'}), timeout=12) as response:
                raw = response.read()
                html = raw.decode("utf-8")
                print(f"HTTP {response.status}; content-type={response.headers.get('Content-Type')}; bytes={len(raw)}; url={response.url}")
                assert response.status == 200
                assert "<!DOCTYPE html>" in html
                assert "US Midterms 2026" in html
                assert "300000" in html
                assert len(raw) > 25000
                print("PASS: Public election dashboard is serving HTML with a 5-minute refresh interval")
                break
            except Exception as exc:
              print(f"Attempt {attempt}: {type(exc).__name__}: {exc}")
              if attempt == 9: raise
              time.sleep(7)
          PY
